<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Top 10 Games</title><style>@import url(https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap);*{box-sizing:border-box}:root{--bg:#0a0b10;--line:#262b38;--line-soft:#1b1f29;--text:#eae7dd;--text-dim:#9294a0;--text-faint:#4d5062;--amber:#e8b04b;--amber-dim:#6b5730;--scrim:10,12,17}body,html{margin:0;background:var(--bg);color:var(--text);font-family:Sora,sans-serif}.wrap{max-width:780px;margin:0 auto;padding:0 20px 100px}.hero{padding:52px 0 28px}h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(26px, 4vw, 32px);line-height:1.15;margin:0;letter-spacing:-.01em}.subtitle{color:var(--text-dim);font-size:14.5px;line-height:1.6;max-width:52ch;margin:10px 0 0}.list{display:flex;flex-direction:column;gap:14px}.entry{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;background:#12141c}.entry .art{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .5s ease,filter .35s ease}.entry:hover .art{transform:scale(1.04)}.entry:not([data-tier="1"]) .art{filter:blur(2px) brightness(.65)}.entry:not([data-tier="1"]):hover .art{filter:blur(0) brightness(1)}.entry .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--scrim),.05) 0,rgba(var(--scrim),.35) 45%,rgba(var(--scrim),.93) 100%)}.rankmark{position:absolute;top:-.14em;right:.08em;font-family:Unbounded,sans-serif;font-weight:900;color:rgba(255,255,255,.14);line-height:1;pointer-events:none;user-select:none}.content{position:relative;z-index:1;padding:16px 20px;width:100%}.row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}.title{font-family:Unbounded,sans-serif;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.6)}.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);text-shadow:0 1px 8px rgba(0,0,0,.7)}.blurb{color:#cfd0d6;font-size:13.5px;line-height:1.5;max-width:56ch;text-shadow:0 1px 8px rgba(0,0,0,.7)}.why{font-size:12.5px;color:var(--text-dim);margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.7)}.why b{color:var(--amber);font-weight:500}.entry[data-tier="1"]{min-height:300px}.entry[data-tier="1"] .rankmark{font-size:190px}.entry[data-tier="1"] .title{font-size:25px}.entry[data-tier="1"] .blurb{font-size:14.5px}.entry[data-tier="2"]{min-height:205px}.entry[data-tier="2"] .rankmark{font-size:130px}.entry[data-tier="2"] .title{font-size:19px}.entry[data-tier="3"]{min-height:130px;transition:min-height .3s ease}.entry[data-tier="3"] .rankmark{font-size:78px}.entry[data-tier="3"]:hover{min-height:220px}.entry[data-tier="3"] .title{font-size:16px}.entry[data-tier="3"] .blurb,.entry[data-tier="3"] .why{max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .25s ease}.entry[data-tier="3"]:hover .blurb{max-height:60px;opacity:1}.entry[data-tier="3"]:hover .why{max-height:40px;opacity:1;margin-top:4px}.entry.empty{border-style:dashed;background:0 0;justify-content:flex-start;align-items:center;min-height:66px!important}.entry.empty:hover{transform:none}.empty-inner{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:0 20px;width:100%}.empty-num{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:15px;color:var(--text-faint);width:22px}.empty-icon{width:26px;height:26px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex:none}.empty-icon svg{width:13px;height:13px}.empty-label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-faint)}@media (max-width:480px){.entry[data-tier="1"]{min-height:240px}.entry[data-tier="1"] .rankmark{font-size:130px}.entry[data-tier="2"]{min-height:170px}.entry[data-tier="2"] .rankmark{font-size:96px}.entry[data-tier="3"]{min-height:108px}}</style></head><body><div class="wrap"><div class="hero"><h1>My top 10 games</h1><p class="subtitle">A running ranking of my all-time favorites, built one slot at a time. Some are games everyone should already know. Others deserve to be.</p></div><div class="list" id="list"></div></div><script>const GAMES_URL="games.json",FALLBACK_GRADIENTS=[["#3c2f1e","#0d0c0a"],["#123b36","#0a0d10"],["#2a1f3d","#0d0c10"],["#3d1f22","#0d0c10"],["#1c2b3d","#0a0c10"]];function fallbackFor(e){let t=0;for(let n=0;n<e.length;n++)t=31*t+e.charCodeAt(n)>>>0;const[n,a]=FALLBACK_GRADIENTS[t%FALLBACK_GRADIENTS.length];return`linear-gradient(160deg, ${n}, ${a})`}const list=document.getElementById("list");function renderList(e){e.forEach((e,t)=>{const n=t+1,a=1===n?1:n<=3?2:3,s=document.createElement("div");if(!e)return s.className="entry empty",s.innerHTML=`\n        <div class="empty-inner">\n          <div class="empty-num">${String(n).padStart(2,"0")}</div>\n          <div class="empty-icon">\n            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">\n              <path d="M12 5v14M5 12h14"/>\n            </svg>\n          </div>\n          <div class="empty-label">open slot — waiting for its game</div>\n        </div>\n      `,void list.appendChild(s);s.className="entry",s.setAttribute("data-tier",a);const i=`https://cdn.cloudflare.steamstatic.com/steam/apps/${e.steamId}/library_hero.jpg`,l=`https://cdn.cloudflare.steamstatic.com/steam/apps/${e.steamId}/header.jpg`,r=fallbackFor(e.title);s.innerHTML=`\n      <div class="art" style="background-image:${r}"></div>\n      <div class="scrim"></div>\n      <div class="rankmark">${n}</div>\n      <div class="content">\n        <div class="row1">\n          <div class="title">${e.title}</div>\n          <span class="tag">${e.tag}</span>\n        </div>\n        <div class="blurb">${e.blurb}</div>\n        <div class="why"><b>Why it's here —</b> ${e.why}</div>\n      </div>\n    `,list.appendChild(s);const d=s.querySelector(".art"),o=new Image;o.onload=()=>{d.style.backgroundImage=`url('${i}')`},o.onerror=()=>{const e=new Image;e.onload=()=>{d.style.backgroundImage=`url('${l}')`},e.src=l},o.src=i})}fetch(GAMES_URL).then(e=>e.json()).then(renderList).catch(()=>{list.innerHTML="<p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-faint);\">\n        Couldn't load games.json. Make sure it's in the same folder as this file,\n        and that you're viewing this over a real web address (not by double-clicking\n        the file on your computer).\n      </p>"})</script></body></html>
